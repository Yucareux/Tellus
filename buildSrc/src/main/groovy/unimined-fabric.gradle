plugins {
    id 'dh-loader'
}

unimined.minecraft {
    fabric {
        loader gradle.ext.fabric_loader_version
        accessWidener project(":common").file("src/main/resources/${gradle.ext.accessWidenerVersion}.distanthorizons.accesswidener")
    }
}

// set the java version for running is necessary for older MC versions
// that don't support the latest java version
def launcher = javaToolchains.launcherFor {
    languageVersion.set(JavaLanguageVersion.of(rootProject.java_version as Integer))
}
runClient.javaLauncher.set(launcher) 
runServer.javaLauncher.set(launcher)
