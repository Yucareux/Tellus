plugins {
	id 'java-library'
	id 'maven-publish'
	alias(libs.plugins.moddev)
	alias(libs.plugins.shadow)
}

def minecraftVersion = '26.2'
def neoForgeVersion = libs.versions.neoForge262.get()
def javaVersion = 25
def distantHorizonsRuntimePath = providers.gradleProperty('mc262_neoforge_distant_horizons_runtime_path').orNull
def twelveMonkeysVersion = libs.versions.twelveMonkeys.get()
def mapboxVectorTileVersion = libs.versions.mapboxVectorTile.get()
def protobufVersion = libs.versions.protobuf.get()

base {
	archivesName = "${rootProject.archives_base_name}-neoforge-${minecraftVersion}"
}

tasks.withType(AbstractArchiveTask).configureEach {
	archiveVersion.set('')
}

repositories {
	mavenCentral()
	maven {
		url = 'https://api.modrinth.com/maven/'
		content {
			includeGroup 'maven.modrinth'
		}
	}
}

sourceSets {
	main {
		java {
			setSrcDirs([rootProject.file('src/main/java'), project.file('src/main/java'), project.file('src/client/java')])
		}
		resources {
			setSrcDirs([rootProject.file('src/main/resources'), project.file('src/main/resources'), project.file('src/client/resources')])
		}
	}
	test {
		java.setSrcDirs([rootProject.file('src/test/java'), project.file('src/test/java')])
		resources.setSrcDirs([rootProject.file('src/test/resources'), project.file('src/test/resources')])
	}
}

neoForge {
	version = neoForgeVersion

	runs {
		client {
			client()
		}

		server {
			server()
			programArgument '--nogui'
		}

		configureEach {
			systemProperty 'forge.logging.markers', 'REGISTRIES'
			logLevel = org.slf4j.event.Level.INFO
		}
	}

	mods {
		tellus {
			sourceSet(sourceSets.main)
		}
	}

	unitTest {
		enable()
		testedMod = mods.tellus
	}
}

configurations {
	relocatedXz
	runtimeClasspath.extendsFrom localRuntime
}

dependencies {
	compileOnly libs.xz
	relocatedXz libs.xz
	jarJar(implementation("io.github.sebasbaumh:mapbox-vector-tile-java:${mapboxVectorTileVersion}") {
		exclude group: 'org.slf4j', module: 'slf4j-api'
	}) {
		version {
			strictly "[${mapboxVectorTileVersion},25.0)"
			prefer mapboxVectorTileVersion
		}
	}
	jarJar(implementation("com.google.protobuf:protobuf-java:${protobufVersion}")) {
		version {
			strictly "[${protobufVersion},5.0)"
			prefer protobufVersion
		}
	}
	jarJar(implementation("com.twelvemonkeys.imageio:imageio-webp:${twelveMonkeysVersion}")) {
		version {
			strictly "[${twelveMonkeysVersion},3.14)"
			prefer twelveMonkeysVersion
		}
	}
	jarJar(implementation("com.twelvemonkeys.imageio:imageio-core:${twelveMonkeysVersion}")) {
		version {
			strictly "[${twelveMonkeysVersion},3.14)"
			prefer twelveMonkeysVersion
		}
	}
	jarJar(implementation("com.twelvemonkeys.imageio:imageio-metadata:${twelveMonkeysVersion}")) {
		version {
			strictly "[${twelveMonkeysVersion},3.14)"
			prefer twelveMonkeysVersion
		}
	}
	jarJar(implementation("com.twelvemonkeys.common:common-lang:${twelveMonkeysVersion}")) {
		version {
			strictly "[${twelveMonkeysVersion},3.14)"
			prefer twelveMonkeysVersion
		}
	}
	jarJar(implementation("com.twelvemonkeys.common:common-io:${twelveMonkeysVersion}")) {
		version {
			strictly "[${twelveMonkeysVersion},3.14)"
			prefer twelveMonkeysVersion
		}
	}
	jarJar(implementation("com.twelvemonkeys.common:common-image:${twelveMonkeysVersion}")) {
		version {
			strictly "[${twelveMonkeysVersion},3.14)"
			prefer twelveMonkeysVersion
		}
	}

	testImplementation libs.junitJupiter
	testImplementation libs.xz
	testRuntimeOnly libs.junitJupiterEngine
	testRuntimeOnly libs.junitPlatformLauncher

	compileOnly libs.distantHorizonsApi
	if (distantHorizonsRuntimePath) {
		localRuntime files(distantHorizonsRuntimePath)
	} else {
		localRuntime libs.xz
	}
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'minecraftVersion', minecraftVersion
	inputs.property 'neoForgeVersion', neoForgeVersion

	filesMatching('META-INF/neoforge.mods.toml') {
		expand version: inputs.properties.version,
			minecraftVersion: inputs.properties.minecraftVersion,
			neoForgeVersion: inputs.properties.neoForgeVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = javaVersion
}

tasks.named('test').configure {
	useJUnitPlatform()
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(javaVersion)
	}

	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(javaVersion)
	targetCompatibility = JavaVersion.toVersion(javaVersion)
}

jar {
	inputs.property 'archivesName', project.base.archivesName
	archiveClassifier = 'unshaded'

	from(rootProject.file('LICENSE')) {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

shadowJar {
	dependsOn jarJar
	archiveClassifier = ''
	configurations = [project.configurations.relocatedXz]
	from(layout.buildDirectory.dir('generated/jarJar'))
	relocate 'org.tukaani.xz', 'com.yucareux.tellus.shaded.org.tukaani.xz'

	from(rootProject.file('LICENSE')) {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			artifactId = project.base.archivesName.get()
			from components.java
		}
	}

	repositories {
	}
}
