plugins {
	id 'base'
}

group = project.maven_group
version = project.mod_version

subprojects {
	group = rootProject.group
	version = rootProject.version
}

tasks.named('clean') {
	dependsOn subprojects.collect { "${it.path}:clean" }
}

tasks.named('assemble') {
	dependsOn subprojects.collect { "${it.path}:assemble" }
}

tasks.named('check') {
	dependsOn subprojects.collect { "${it.path}:check" }
}

tasks.named('build') {
	dependsOn subprojects.collect { "${it.path}:build" }
}

// Convenience tasks that address a single Minecraft target.
// Format: [task name, module, module task, task group, description]
def targets = [
	['build1201', 'mc1201', 'build', 'build', 'Builds the Minecraft 1.20.1 Fabric target.'],
	['build1211', 'mc1211', 'build', 'build', 'Builds the Minecraft 1.21.1 Fabric target.'],
	['build1211NeoForge', 'mc1211-neoforge', 'build', 'build', 'Builds the Minecraft 1.21.1 NeoForge target.'],
	['build262', 'mc262', 'build', 'build', 'Builds the Minecraft 26.2 Fabric target.'],
	['build262NeoForge', 'mc262-neoforge', 'build', 'build', 'Builds the Minecraft 26.2 NeoForge target.'],
	['runClient1201', 'mc1201', 'runClient', 'fabric', 'Runs the Minecraft 1.20.1 client target.'],
	['runClient1211', 'mc1211', 'runClient', 'fabric', 'Runs the Minecraft 1.21.1 client target.'],
	['runClient1211NeoForge', 'mc1211-neoforge', 'runClient', 'neoforge', 'Runs the Minecraft 1.21.1 NeoForge client target.'],
	['runClient262', 'mc262', 'runClient', 'fabric', 'Runs the Minecraft 26.2 client target.'],
	['runClient262NeoForge', 'mc262-neoforge', 'runClient', 'neoforge', 'Runs the Minecraft 26.2 NeoForge client target.'],
	['runServer1201', 'mc1201', 'runServer', 'fabric', 'Runs the Minecraft 1.20.1 server target.'],
	['runServer1211', 'mc1211', 'runServer', 'fabric', 'Runs the Minecraft 1.21.1 server target.'],
	['runServer1211NeoForge', 'mc1211-neoforge', 'runServer', 'neoforge', 'Runs the Minecraft 1.21.1 NeoForge server target.'],
	['runServer262', 'mc262', 'runServer', 'fabric', 'Runs the Minecraft 26.2 server target.'],
	['runServer262NeoForge', 'mc262-neoforge', 'runServer', 'neoforge', 'Runs the Minecraft 26.2 NeoForge server target.'],
]

targets.each { taskName, moduleName, moduleTask, taskGroup, description ->
	tasks.register(taskName) {
		group = taskGroup
		description = description
		dependsOn ":${moduleName}:${moduleTask}"
	}
}
