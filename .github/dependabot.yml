version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # Tracks gradle/libs.versions.toml and per-module build files.
  # Keep auto-merge off: loader/API versions are coupled per Minecraft target.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    open-pull-requests-limit: 10
