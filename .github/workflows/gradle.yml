name: Gradle build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: gradle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: mc1201
            label: fabric-1.20.1
          - module: mc1211
            label: fabric-1.21.1
          - module: mc1211-neoforge
            label: neoforge-1.21.1
          - module: mc262
            label: fabric-26.2
          - module: mc262-neoforge
            label: neoforge-26.2
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Java 25
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Build and test ${{ matrix.label }}
        run: ./gradlew :${{ matrix.module }}:build --stacktrace

      - name: Upload ${{ matrix.label }} artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tellus-${{ matrix.label }}
          path: ${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: warn
