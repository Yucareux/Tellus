name: Gradle build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: gradle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Keeps the write token out of .git/config, so only the publish step can use it.
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Build and test every target
        run: ./gradlew build --stacktrace

      - name: Publish the dev build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          # The Distant Horizons fork is built outside this repository, so its jars come from their own release.
          DH_RELEASE: distant-horizons-3.3.4-tellus.1
        run: |
          jars=$(ls mc*/build/libs/Tellus-*.jar | grep -vE -- '-(sources|unshaded|dev-shadow)\.jar$')
          # Downloads before the delete, so a missing release leaves the previous dev build in place.
          gh release download "$DH_RELEASE" --pattern '*.jar' --dir "$RUNNER_TEMP/dh"
          gh release delete dev-build --cleanup-tag --yes || true
          gh release create dev-build $jars "$RUNNER_TEMP"/dh/*.jar --prerelease --target "$GITHUB_SHA" \
            --title "Dev build ${GITHUB_SHA::7}" \
            --notes "Built automatically from the latest commit on main. Not a stable release. The DistantHorizons jars are the Tellus fork from the $DH_RELEASE release."
