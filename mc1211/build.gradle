plugins {
	alias(libs.plugins.loomRemap)
	id 'maven-publish'
}

def minecraftVersion = '1.21.1'
def javaVersion = 21
def distantHorizonsRuntimePath = providers.gradleProperty('mc1211_distant_horizons_runtime_path').orNull

base {
	archivesName = "${rootProject.archives_base_name}-fabric-${minecraftVersion}"
}

configurations {
	bundledLibrary
}

tasks.withType(AbstractArchiveTask).configureEach {
	archiveVersion.set('')
}

repositories {
	mavenCentral()
	maven {
		url = 'https://api.modrinth.com/maven/'
		content {
			includeGroup 'maven.modrinth'
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		tellus {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets {
	main {
		java {
			setSrcDirs([rootProject.file('src/main/java'), project.file('src/main/java')])
		}
		resources {
			setSrcDirs([rootProject.file('src/main/resources'), project.file('src/main/resources')])
		}
	}
	client {
		java.setSrcDirs([project.file('src/client/java')])
		resources.setSrcDirs([project.file('src/client/resources')])
	}
	test {
		java.setSrcDirs([rootProject.file('src/test/java'), project.file('src/test/java')])
		resources.setSrcDirs([rootProject.file('src/test/resources'), project.file('src/test/resources')])
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraftVersion}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${libs.versions.fabricLoader1211.get()}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${libs.versions.fabricApi1211.get()}"

	bundledLibrary "org.tukaani:xz:${libs.versions.xz.get()}"
	implementation libs.xz
	implementation "io.github.sebasbaumh:mapbox-vector-tile-java:${libs.versions.mapboxVectorTile.get()}"
	include "io.github.sebasbaumh:mapbox-vector-tile-java:${libs.versions.mapboxVectorTile.get()}"
	implementation "com.google.protobuf:protobuf-java:${libs.versions.protobuf.get()}"
	include "com.google.protobuf:protobuf-java:${libs.versions.protobuf.get()}"
	implementation "com.twelvemonkeys.imageio:imageio-webp:${libs.versions.twelveMonkeys.get()}"
	implementation "com.twelvemonkeys.imageio:imageio-core:${libs.versions.twelveMonkeys.get()}"
	implementation "com.twelvemonkeys.imageio:imageio-metadata:${libs.versions.twelveMonkeys.get()}"
	implementation "com.twelvemonkeys.common:common-lang:${libs.versions.twelveMonkeys.get()}"
	implementation "com.twelvemonkeys.common:common-io:${libs.versions.twelveMonkeys.get()}"
	implementation "com.twelvemonkeys.common:common-image:${libs.versions.twelveMonkeys.get()}"
	include "com.twelvemonkeys.imageio:imageio-webp:${libs.versions.twelveMonkeys.get()}"
	include "com.twelvemonkeys.imageio:imageio-core:${libs.versions.twelveMonkeys.get()}"
	include "com.twelvemonkeys.imageio:imageio-metadata:${libs.versions.twelveMonkeys.get()}"
	include "com.twelvemonkeys.common:common-lang:${libs.versions.twelveMonkeys.get()}"
	include "com.twelvemonkeys.common:common-io:${libs.versions.twelveMonkeys.get()}"
	include "com.twelvemonkeys.common:common-image:${libs.versions.twelveMonkeys.get()}"

	testImplementation libs.junitJupiter
	testRuntimeOnly libs.junitJupiterEngine
	testRuntimeOnly libs.junitPlatformLauncher

	compileOnly "maven.modrinth:DistantHorizonsApi:${libs.versions.distantHorizonsApi.get()}"
	if (distantHorizonsRuntimePath) {
		runtimeOnly files(distantHorizonsRuntimePath)
	}
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand version: inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = javaVersion
}

tasks.named('test').configure {
	useJUnitPlatform()
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(javaVersion)
	}

	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(javaVersion)
	targetCompatibility = JavaVersion.toVersion(javaVersion)
}

jar {
	inputs.property 'archivesName', project.base.archivesName

	from({
		configurations.bundledLibrary.collect { zipTree(it) }
	}) {
		exclude 'META-INF/MANIFEST.MF'
	}

	from(rootProject.file('LICENSE')) {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			artifactId = project.base.archivesName.get()
			from components.java
		}
	}

	repositories {
	}
}
