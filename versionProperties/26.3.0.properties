# 26.3.0 version
java_version=25
minecraft_version=26.3
compatible_minecraft_versions=["26.3"]
accessWidenerVersion=26_3
builds_for=fabric,neoforge
# forge is broken due to gradle/build script issues

# Netty
netty_version=4.1.97.Final

# LWJGL
lwjgl_version=3.4.1

# Fabric loader
fabric_loader_version=0.19.5
fabric_api_version=0.160.5+26.3
    modmenu_version=21.0.0-beta.1
    starlight_version_fabric=
    phosphor_version_fabric=
    lithium_version=
    sodium_version=mc26.3-0.9.2-fabric
    iris_version=1.11.6+26.3-fabric
    bclib_version=
    immersive_portals_version=
    canvas_version=
    # 1.5.3
    chunky_version=4Eotm6ov
    
    # vertigo - prevents DH from seeing the full chunk, causing holes
    fabric_incompatibility_list={ "vertigo": "*" }
    fabric_recommend_list={}

    # Fabric mod run
    # 0 = Don't enable and don't run
    # 1 = Can be referenced in code but doesn't run
    # 2 = Can be referenced in code and runs in client
    enable_mod_menu=1
    enable_starlight=0
    enable_phosphor=0
    enable_sodium=1
    enable_lithium=0
    enable_iris=1
    enable_bclib=0
    enable_immersive_portals=0
    enable_canvas=0
    enable_chunky=1

# NeoForge loader
forge_version=
neoforge_version=0-beta
neoforge_version_range=[*,)

    # NeoForge mod versions
    # TODO replace with neoforge 26.3 version when available 
    neo_sodium_version=mc26.3-0.9.2-fabric
    # TODO replace with 26.3 version when available
    neo_iris_version=1.11.4+26.2-neoforge
    neo_chunky_version=EyCqftOK

    neoforge_dependencies=

    # (Neo)Forge mod run
    # 0 = Don't enable and don't run
    # 1 = Can be referenced in code but doesn't run
    # 2 = Can be referenced in code and runs in client
    neo_enable_sodium=1
    neo_enable_iris=1
    neo_enable_chunky=1
