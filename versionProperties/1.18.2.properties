# 1.18.2 version
java_version=17
minecraft_version=1.18.2
compatible_minecraft_versions=["1.18.2"]
accessWidenerVersion=1_18
builds_for=fabric,forge
embed_joml=true

# Netty
netty_version=4.1.68.Final

# LWJGL
# the actual LWJGL version is 3.2.2, but the oldest BOM version available on maven is 3.2.3
lwjgl3_version=3.2.3

# Fabric loader
fabric_loader_version=0.14.24
fabric_api_version=0.76.0+1.18.2
    # Fabric mod versions
    modmenu_version=3.2.5
    #architectury_version=4.4.59
    starlight_version_fabric=3667443
    phosphor_version_fabric=3573395
    lithium_version=mc1.18.2-0.10.3
    sodium_version=mc1.18.2-0.4.1
    iris_version=1.6.10+1.18.2
    bclib_version=1.4.6
    canvas_version=mc118:1.0.2616
	# DH needs 1.3.38 or newer
    chunky_version=1.2.164

    # iris - needs 1.7.4+ to support the DH API
    fabric_incompatibility_list={ "iris": "*" }
    fabric_recommend_list={}

    # Fabric mod run
    # 0 = Don't enable and don't run
    # 1 = Can be referenced in code but doesn't run
    # 2 = Can be referenced in code and runs in client
    enable_mod_menu=2
    enable_starlight=0
    enable_phosphor=0
    enable_sodium=1
    enable_lithium=0
    enable_iris=1
    enable_bclib=1
    enable_canvas=0
	enable_chunky=0

quilt_loader_version=0.19.1
quilted_api_version=1.0.0-beta.28+0.67.0-1.18.2
    # Quilt mod versions
    ### Most of the time quilt uses the same stuff as fabric, so this is empty atm ###

    # Quilt mod versions
    ### Idk what you expected, sutch empty ###

# Forge loader
forge_version=40.2.10
	# Neo not used but the variable still needs to be defined to make gradle happy
	neoforge_version_range=[*,)
    neoforge_dependencies=
	
    # Forge mod versions
    terraforged_version=
    oculus_version=
	# 1.2.164 # DH needs 1.3.38 or newer
    forge_chunky_version=T7Yrm4uq

    # Forge mod run
    # 0 = Don't enable and don't run
    # 1 = Can be referenced in code but doesn't run
    # 2 = Can be referenced in code and runs in client
    enable_starlight_forge=0
    enable_terraforged=0
    enable_terrafirmacraft=0
    enable_oculus=0
    forge_enable_chunky=0
