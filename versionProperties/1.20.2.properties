# 1.20.2 version
java_version=17
minecraft_version=1.20.2
compatible_minecraft_versions=["1.20.2"]
accessWidenerVersion=1_20_2
builds_for=fabric,forge

# Netty
netty_version=4.1.97.Final

# LWJGL
lwjgl3_version=3.3.2

# Fabric loader
fabric_loader_version=0.15.6
fabric_api_version=0.90.4+1.20.2
    # Fabric mod versions
    modmenu_version=8.0.0
    starlight_version_fabric=
    phosphor_version_fabric=
    lithium_version=
    sodium_version=mc1.20.2-0.5.3
    # use the newer 1.20.4 version of Iris since that uses the new namespace
    # and since we don't support 1.7.2 anyway, in the off chance someone updates Iris to 1.7.5+
    # this allows us to work normally
    iris_version=1.7.2+1.20.4
    bclib_version=3.0.13
    canvas_version=
	# 1.3.146
    chunky_version=NHWYq9at

    # iris - needs 1.7.4+ to support the DH API
    # vertigo - prevents DH from seeing the full chunk, causing holes    
    fabric_incompatibility_list={ "iris": "<=1.7.4", "vertigo": "*" }
    fabric_recommend_list={}
    
    # Fabric mod run
    # 0 = Don't enable and don't run
    # 1 = Can be referenced in code but doesn't run
    # 2 = Can be referenced in code and runs in client
    enable_mod_menu=2
    enable_starlight=0
    enable_phosphor=0
    enable_sodium=1
    enable_lithium=0
    enable_iris=1
    enable_bclib=1
    enable_canvas=0
	enable_chunky=1

# Forge loader
forge_version=48.0.13
	# Neo not used but the variable still needs to be defined to make gradle happy
	neoforge_version_range=[*,)
    neoforge_dependencies=

    # Forge mod versions
    terraforged_version=
    oculus_version=
	# 1.3.146
    forge_chunky_version=4FTDk9wv

    # Forge mod run
    # 0 = Don't enable and don't run
    # 1 = Can be referenced in code but doesn't run
    # 2 = Can be referenced in code and runs in client
    enable_starlight_forge=0
    enable_terraforged=0
    enable_terrafirmacraft=0
    enable_oculus=0
    forge_enable_chunky=1
