# 1.21.6 version
java_version=21
minecraft_version=1.21.6
compatible_minecraft_versions=["1.21.6"]
accessWidenerVersion=1_21_4
builds_for=fabric,neoforge
# forge is broken due to gradle/build script issues

# Netty
netty_version=4.1.97.Final

# LWJGL
lwjgl3_version=3.3.3

# Fabric loader
fabric_loader_version=0.16.13
fabric_api_version=0.127.0+1.21.6
    modmenu_version=15.0.0-beta.2
    starlight_version_fabric=
    phosphor_version_fabric=
    lithium_version=
    sodium_version=mc1.21.6-0.6.13-fabric
    iris_version=1.9.0+1.21.6-fabric
    bclib_version=
    canvas_version=
	# 1.4.23
    chunky_version=RVFHfo1D

    # vertigo - prevents DH from seeing the full chunk, causing holes
    fabric_incompatibility_list={ "vertigo": "*" }
    fabric_recommend_list={}
    
    # Fabric mod run
    # 0 = Don't enable and don't run
    # 1 = Can be referenced in code but doesn't run
    # 2 = Can be referenced in code and runs in client
    enable_mod_menu=2
    enable_starlight=0
    enable_phosphor=0
    enable_sodium=1
    enable_lithium=0
    enable_iris=1
    enable_bclib=0
    enable_canvas=0
	enable_chunky=1

# NeoForge loader
forge_version=
neoforge_version=20-beta
    # around 6.19 neo changed how their render API works, failing to meet this causes the game to crash
    neoforge_version_range=[21.6.19-beta,)

    # NeoForge mod versions
	neo_sodium_version=
    neo_iris_version=1.9.6+1.21.8-neoforge
	# 1.4.23
    neo_chunky_version=LuFhm4eU

    neoforge_dependencies=

    # (Neo)Forge mod run
    # 0 = Don't enable and don't run
    # 1 = Can be referenced in code but doesn't run
    # 2 = Can be referenced in code and runs in client
	neo_enable_sodium=0
    neo_enable_iris=1
    neo_enable_chunky=1
