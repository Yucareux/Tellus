# 26.1.2 version
java_version=25
minecraft_version=26.1.2
compatible_minecraft_versions=["26.1.0", "26.1.1", "26.1.2"]
accessWidenerVersion=26_1
builds_for=fabric,neoforge
# forge is broken due to gradle/build script issues

# Netty
netty_version=4.1.97.Final

# LWJGL
lwjgl3_version=3.4.1

# Fabric loader
fabric_loader_version=0.18.5
fabric_api_version=0.149.1+26.1.2
    modmenu_version=18.0.0-alpha.8
    starlight_version_fabric=
    phosphor_version_fabric=
    lithium_version=
    sodium_version=mc26.1.1-0.8.9-fabric
    iris_version=1.11.4+26.1-fabric
    bclib_version=
    immersive_portals_version=
    canvas_version=
	# 1.5.4
    chunky_version=4Eotm6ov
    
    # vertigo - prevents DH from seeing the full chunk, causing holes
    # Iris - Iris added a new depth feature we need to track in 1.11.4, so we no longer support 1.11.2 and older
    fabric_incompatibility_list={ "vertigo": "*", "iris": "<1.11.2" }
    fabric_recommend_list={}

    # Fabric mod run
    # 0 = Don't enable and don't run
    # 1 = Can be referenced in code but doesn't run
    # 2 = Can be referenced in code and runs in client
    enable_mod_menu=2
    enable_starlight=0
    enable_phosphor=0
    enable_sodium=1
    enable_lithium=0
    enable_iris=1
    enable_bclib=0
    enable_immersive_portals=0
    enable_canvas=0
	enable_chunky=1

# NeoForge loader
forge_version=
neoforge_version=15-beta
neoforge_version_range=[*,)
    
    # NeoForge mod versions
    neo_sodium_version=
    neo_iris_version=1.11.4+26.1-neoforge
	# 1.5.4
    neo_chunky_version=EyCqftOK

    neoforge_dependencies=

    # (Neo)Forge mod run
    # 0 = Don't enable and don't run
    # 1 = Can be referenced in code but doesn't run
    # 2 = Can be referenced in code and runs in client
    neo_enable_sodium=0
    neo_enable_iris=1
    neo_enable_chunky=1
