# 1.20.6 version
java_version=21
minecraft_version=1.20.6
compatible_minecraft_versions=["1.20.6"]
accessWidenerVersion=1_20_6
builds_for=fabric,neoforge
# forge is broken due to gradle/build script issues

# Netty
netty_version=4.1.97.Final

# LWJGL
lwjgl3_version=3.3.3

# Fabric loader
fabric_loader_version=0.15.10
fabric_api_version=0.97.8+1.20.6
    # Fabric mod versions
    modmenu_version=10.0.0-beta.1
    starlight_version_fabric=
    phosphor_version_fabric=
    lithium_version=
    sodium_version=mc1.20.6-0.5.8
    iris_version=1.7.0+1.20.6
    bclib_version=
    canvas_version=
	# 1.3.146
    chunky_version=NHWYq9at

    # iris - needs 1.7.4+ to support the DH API
    # vertigo - prevents DH from seeing the full chunk, causing holes
    fabric_incompatibility_list={ "iris": "<=1.7.4", "vertigo": "*" }
    fabric_recommend_list={}
    
    # Fabric mod run
    # 0 = Don't enable and don't run
    # 1 = Can be referenced in code but doesn't run
    # 2 = Can be referenced in code and runs in client
    enable_mod_menu=2
    enable_starlight=0
    enable_phosphor=0
    enable_sodium=1
    enable_lithium=0
    enable_iris=1
    enable_bclib=0
    enable_canvas=0
	enable_chunky=1

# NeoForge loader
forge_version=
neoforge_version=136
    neoforge_version_range=[*,)
    
    # NeoForge mod versions
	neo_sodium_version=
    neo_iris_version=1.8.12+1.21.1-neoforge
	# 1.4.10
    neo_chunky_version=WrsGq1Qf

    neoforge_dependencies=

    # (Neo)Forge mod run
    # 0 = Don't enable and don't run
    # 1 = Can be referenced in code but doesn't run
    # 2 = Can be referenced in code and runs in client
	neo_enable_sodium=0
    neo_enable_iris=1
    neo_enable_chunky=1
