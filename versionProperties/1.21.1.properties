# 1.21.1 version
java_version=21
minecraft_version=1.21.1
compatible_minecraft_versions=["1.21", "1.21.1"]
accessWidenerVersion=1_20_6
builds_for=fabric,neoforge
# forge is broken due to gradle/build script issues

# Netty
netty_version=4.1.97.Final

# LWJGL
lwjgl3_version=3.3.3

# Fabric loader
fabric_loader_version=0.16.9
fabric_api_version=0.116.11+1.21.1
    # Fabric mod versions
    modmenu_version=11.0.0-beta.1
    starlight_version_fabric=
    phosphor_version_fabric=
    lithium_version=
    sodium_version=mc1.21.1-0.6.2-fabric
    iris_version=1.8.1+1.21.1-fabric
    bclib_version=
    canvas_version=
	# 1.4.23
    chunky_version=RVFHfo1D

    # iris - needs 1.7.4+ to support the DH API
    # vertigo - prevents DH from seeing the full chunk, causing holes
    fabric_incompatibility_list={ "iris": "<=1.7.4", "vertigo": "*" }
    fabric_recommend_list={}
    
    # Fabric mod run
    # 0 = Don't enable and don't run
    # 1 = Can be referenced in code but doesn't run
    # 2 = Can be referenced in code and runs in client
    enable_mod_menu=2
    enable_starlight=0
    enable_phosphor=0
    enable_sodium=1
    enable_lithium=0
    enable_iris=1
    enable_bclib=0
    enable_canvas=0
	enable_chunky=1

# NeoForge loader
forge_version=
neoforge_version=228
    neoforge_version_range=[*,)
    
    # NeoForge mod versions
	neo_sodium_version=
    neo_iris_version=1.8.12+1.21.1-neoforge
	# 1.4.23
    neo_chunky_version=LuFhm4eU

# Separate Sable Render Distance - 1.8.6 and below don't take DH's reverse Z rendering into account, causing DH terrain to render incorrectly
# https://docs.neoforged.net/docs/gettingstarted/modfiles/#dependency-configurations
neoforge_dependencies=\
[[dependencies.distanthorizons]] \n\
    modId = \"ssrd\" \n\
    type = \"incompatible\" \n\
    reason = \"SSRD needs to use DH\'s API to get the correct GL depth rendering, otherwise DH rendering will be corrupted.\" \n\
    versionRange = \"[*,1.8.6]\"

    # (Neo)Forge mod run
    # 0 = Don't enable and don't run
    # 1 = Can be referenced in code but doesn't run
    # 2 = Can be referenced in code and runs in client
	neo_enable_sodium=0
    neo_enable_iris=1
    neo_enable_chunky=1

