# use Eclipse's JDK
# The ci should always use a unix(-like) OS to work
image: eclipse-temurin:25

# all stages need to be defined here
stages:
  - translations
  - build
  - api
  - pages

variables:
  # Pull core when building
  GIT_SUBMODULE_STRATEGY: recursive
  # retry downloading sources,
  # this is necessary if Gitlab fails to download the repo/sources
  # on the first try
  GET_SOURCES_ATTEMPTS: 5
  ARTIFACT_DOWNLOAD_ATTEMPTS: 5
  RESTORE_CACHE_ATTEMPTS: 5


# Shared bash helper: 
# retry a command up to 3 times with a 30s delay between attempts.
# GitLab's `retry:` keyword doesn't have a delay so we need to
# use a bash script instead
.retry_script: &retry_script |
  retry() {
    local n=1
    local max=3
    local delay=30
    until "$@"; do
      if [ "$n" -ge "$max" ]; then
        echo "Command failed after [${n}] attempts: [$*]" >&2
        return 1
      fi
      echo "Attempt [${n}/${max}] failed, retrying in [${delay}] sec..." >&2
      n=$((n + 1))
      sleep "$delay"
    done
  }

# These can be extended so code is a bit less duplicated
.build_java:
  #image: eclipse-temurin:17
  cache:
    key: "gradleCache_$CI_JOB_NAME_SLUG"
    policy: pull-push
    paths:
      - .gradle
      - cache/
  allow_failure: true
  retry:
      max: 2
      when:
          - runner_system_failure
          - stuck_or_timeout_failure


build:
  stage: build
  needs:
    - job: translations
      artifacts: true
  parallel:
    matrix:
      - MC_VER: [
      "26.3.0",
      "26.2.0",
      "26.1.2",
      "1.21.11", "1.21.10", "1.21.9", "1.21.8", "1.21.6", "1.21.5", "1.21.4", "1.21.3", "1.21.1",
      "1.20.6", "1.20.4", "1.20.2", "1.20.1",
      "1.19.4", "1.19.2",
      "1.18.2",
      "1.17.1",
      "1.16.5",
      "1.12.2",
      "1.7.10"
      ]
  before_script:
    - *retry_script
    # Only MC 1.16.5 (Java 8), 1.12.2 and 1.7.10 (JDK 8 for MC alongside JDK 25 for unimined) need JDK 8
    # Installing it for every matrix job floods the network with parallel apt installs at pipeline start for no reason.
    - |
      case "$MC_VER" in
        1.16.5|1.12.2|1.7.10)
          retry apt-get update -q
          retry apt-get install -y openjdk-8-jdk
          ;;
      esac
  script:
    # this both runs the unit tests and assembles the code
    # (no separate clean: the container starts fresh, so build/ is already empty)
    - retry ./gradlew build -PmcVer="${MC_VER}" -PinfoGitCommit="${CI_COMMIT_SHA}" -PinfoGitBranch="${CI_COMMIT_BRANCH}" -PinfoBuildSource="GitLab CI (${CI_PIPELINE_ID})" --gradle-user-home cache/;
    - cp ./fabric/build/libs/* ./forge17/build/libs/* ./forge112/build/libs/* ./forge/build/libs/* ./neoforge/build/libs/* ./build/forgix/* . || true
  artifacts:
    name: "NightlyBuild_${MC_VER}-${CI_COMMIT_SHORT_SHA}-${CI_COMMIT_TIMESTAMP}"
    paths:
      - ./*.jar
    exclude:
      - ./*-all.jar
      - ./*-dev.jar
      - ./*-sources.jar
    expire_in: 14 days
    when: always
  extends: .build_java


api:
  stage: api
  needs: []
  before_script:
    - *retry_script
  script:
    # this should only run for the API
    # this also runs unit tests
    - retry ./gradlew api:build --gradle-user-home cache/;
    # build the javadoc here so the pages job can publish it without triggering another API build
    - retry ./gradlew api:javadoc --gradle-user-home cache/;
    - cp ./coreSubProjects/api/build/libs/* .
  artifacts:
    name: "NightlyBuild_Api-${CI_COMMIT_SHORT_SHA}-${CI_COMMIT_TIMESTAMP}"
    paths:
      - ./*-combined.jar
      - coreSubProjects/api/build/docs/javadoc
    exclude:
      - ./*-all.jar
      - ./*-dev.jar
      - ./*-sources.jar
    expire_in: 1 day
    when: always
  extends: .build_java


# publish the API javadocs built by the api job
pages:
  stage: pages
  needs:
    - job: api
      artifacts: true
  script:
    - mkdir public
    - cp -r $CI_PROJECT_DIR/coreSubProjects/api/build/docs/javadoc/. public
  artifacts:
    paths:
      - public
  allow_failure: false

translations:
  stage: translations
  needs: []
  image: crowdin/cli:latest
  before_script:
    - *retry_script
  script:
    - if [ "$CI_COMMIT_BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || git diff --name-only "$CI_COMMIT_BEFORE_SHA" "$CI_COMMIT_SHA" -- coreSubProjects/core/src/main/resources/assets/distanthorizons/lang | grep -q .; then retry crowdin upload sources; fi
    - retry crowdin download --export-only-approved --skip-untranslated-files
    - for f in coreSubProjects/core/src/main/resources/assets/distanthorizons/lang/*.json; do [ -e "$f" ] || continue; sed -i 's/\\\\n/\\n/g' "$f"; n="$(basename "$f" | tr '[:upper:]' '[:lower:]')"; [ "$(basename "$f")" = "$n" ] || mv "$f" "$(dirname "$f")/$n"; done
  artifacts:
    paths:
      - coreSubProjects/core/src/main/resources/assets/distanthorizons/lang/**
    expire_in: 1 day
    when: always
